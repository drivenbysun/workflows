name: Set server secrets (reusable)

# Traegt Geheimnisse (und unkritische Einstellwerte) in die .env eines Dienstes
# auf einem EIGENEN Server ein, ohne dass ein Wert durch einen Chat oder einen
# Prozess-Argumentvektor laeuft. Aufrufbar aus jedem Repo, Beispiel und
# Sicherheitsmodell: README.md.
#
# Zusammengefuehrt aus zwei frueheren Einzel-Workflows der Portale; ab
# jetzt die EINZIGE gepflegte Fassung.
#
# Unverhandelbar (test/run.sh prueft das, jeder Punkt hat einen Test):
#   - Werte nur als env eines Steps bzw. per stdin zum Server. Nie Argument, nie
#     GITHUB_ENV, kein echo, kein set -x. Im Log nur Namen.
#   - Fehlt ein Wert: Abbruch mit dem NAMEN, nichts geschrieben.
#   - Hostschluessel des Servers ist GEPINNT (Eingabe host-key), StrictHost
#     KeyChecking yes, kein ssh-keyscan, keine Systemdatei als Vertrauensanker.
#   - Neue Datei wird VOR dem Austausch geprueft, Austausch atomar, Rechte 600.
#   - Zufallswerte nur, wenn sie fehlen. Ein zweiter Lauf aendert nichts,
#     die Datei bleibt bytegleich.
#   - Keine fremden Actions (kein `uses:`), permissions: {}.
#
# Warum feste Slots V01..V10: ein aufrufbarer Workflow kann nur Secrets
# entgegennehmen, die er beim Namen kennt. Der Aufrufer belegt die Slots und
# benennt sie in `secret-names` (V01=GOOGLE_CLIENT_ID); die GitHub-Secret-Namen
# im Aufrufer sind frei. Ein belegter, aber nicht benannter Slot bricht ab.

on:
  workflow_call:
    inputs:
      host:
        description: "Server (Name oder IPv4), z. B. 203.0.113.10"
        required: true
        type: string
      user:
        description: "SSH-Nutzer, dem die .env gehoert"
        required: true
        type: string
      port:
        description: "SSH-Port"
        required: false
        type: string
        default: "22"
      env-file:
        description: "Absoluter Pfad der .env auf dem Server"
        required: true
        type: string
      host-key:
        description: "GEPINNTER oeffentlicher ED25519-Hostschluessel: 'ssh-ed25519 AAAA...' (eine Zeile)"
        required: true
        type: string
      secret-names:
        description: "Je Zeile SLOT=NAME, z. B. V01=GOOGLE_CLIENT_ID (NAME = Schluessel in der .env). Leer nur, wenn plain-values etwas enthaelt"
        required: false
        type: string
        default: ""
      plain-values:
        description: "Je Zeile NAME=wert fuer NICHT geheime Einstellungen (landen im Klartext im Aufrufer-Repo)"
        required: false
        type: string
        default: ""
      random-keys:
        description: "Schluessel, die der Server selbst erzeugt (openssl rand -hex 32), NUR wenn sie fehlen; durch Leerzeichen/Zeilen getrennt"
        required: false
        type: string
        default: ""
      patterns:
        description: "Je Zeile NAME=ERE: Formpruefung eines Werts (grep -E), z. B. GOOGLE_CLIENT_ID=^[0-9]+-.*[.]apps[.]googleusercontent[.]com$"
        required: false
        type: string
        default: ""
      dry-run:
        description: "true: alles pruefen und melden, was geaendert wuerde, aber die .env NICHT anfassen"
        required: false
        type: boolean
        default: false
    secrets:
      SSH_KEY:
        description: "Privater Deploy-Schluessel fuer user@host"
        required: true
      V01: { required: false }
      V02: { required: false }
      V03: { required: false }
      V04: { required: false }
      V05: { required: false }
      V06: { required: false }
      V07: { required: false }
      V08: { required: false }
      V09: { required: false }
      V10: { required: false }

# Der Workflow braucht KEINE Rechte am Repo (kein Checkout, keine API-Aufrufe).
permissions: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Eingaben pruefen und Nutzlast bauen (bricht mit NAMEN ab, nie mit Werten)
        id: pruefen
        env:
          IN_HOST: ${{ inputs.host }}
          IN_USER: ${{ inputs.user }}
          IN_PORT: ${{ inputs.port }}
          IN_ENVFILE: ${{ inputs.env-file }}
          IN_HOSTKEY: ${{ inputs.host-key }}
          IN_NAMES: ${{ inputs.secret-names }}
          IN_PLAIN: ${{ inputs.plain-values }}
          IN_RANDOM: ${{ inputs.random-keys }}
          IN_PATTERNS: ${{ inputs.patterns }}
          IN_DRY: ${{ inputs.dry-run }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          V01: ${{ secrets.V01 }}
          V02: ${{ secrets.V02 }}
          V03: ${{ secrets.V03 }}
          V04: ${{ secrets.V04 }}
          V05: ${{ secrets.V05 }}
          V06: ${{ secrets.V06 }}
          V07: ${{ secrets.V07 }}
          V08: ${{ secrets.V08 }}
          V09: ${{ secrets.V09 }}
          V10: ${{ secrets.V10 }}
        run: |
          set +x
          umask 077
          fail() { echo "::error::$1 Nichts geschrieben."; exit 1; }
          # Ganzer String muss passen: [[ =~ ]] kennt kein "eine Zeile reicht" wie grep
          # bei mehrzeiligen Werten.
          passt() { [[ "$1" =~ $2 ]]; }
          NAME_RE='^[A-Za-z_][A-Za-z0-9_]*$'
          # Zeichen, die in einer systemd-EnvironmentFile / .env nichts verfaelschen
          # (kein Leerzeichen, Zeilenumbruch, Anfuehrungszeichen, Backslash, $, #).
          WERT_RE='^[A-Za-z0-9_.:/+=@%,~-]+$'

          passt "$IN_HOST" '^[A-Za-z0-9._-]+$' || fail "Eingabe host ist kein Servername/keine IPv4."
          passt "$IN_USER" '^[a-z_][a-z0-9_-]*$' || fail "Eingabe user ist kein gueltiger Nutzername."
          passt "$IN_PORT" '^[0-9]{1,5}$' || fail "Eingabe port ist keine Zahl."
          passt "$IN_ENVFILE" '^/[A-Za-z0-9._/-]+$' || fail "Eingabe env-file muss ein absoluter Pfad ohne Sonderzeichen sein."
          case "$IN_ENVFILE" in *..*) fail "Eingabe env-file darf kein '..' enthalten." ;; esac
          passt "$IN_HOSTKEY" '^ssh-ed25519 AAAAC3NzaC1lZDI1NTE5[A-Za-z0-9+/]{48}$' \
            || fail "Eingabe host-key muss ein oeffentlicher ED25519-Schluessel in EINER Zeile sein ('ssh-ed25519 AAAA...'). Den Schluessel nie zur Laufzeit vom Server abfragen, siehe README."
          case "$IN_DRY" in true|false) ;; *) fail "Eingabe dry-run muss true oder false sein." ;; esac

          # Slot -> Name und Name -> Wert ohne assoziative Arrays (laeuft so auch in
          # bash 3.2, damit der lokale Test denselben Text ausfuehren kann).
          slotname() { local v="SLOTNAME_$1"; printf '%s' "${!v:-}"; }
          setwert()  { printf -v "WERT__$1" '%s' "$2"; }
          hatwert()  { local v="WERT__$1"; [ -n "${!v+x}" ]; }
          wertvon()  { local v="WERT__$1"; printf '%s' "${!v}"; }

          fehlt=""
          KEYS=""
          while IFS= read -r zeile || [ -n "$zeile" ]; do
            zeile="${zeile%$'\r'}"
            [ -n "${zeile// }" ] || continue
            passt "$zeile" '^V(0[1-9]|10)=[A-Za-z_][A-Za-z0-9_]*$' \
              || fail "secret-names: Zeile nicht der Form V01=NAME (Slot V01..V10, NAME ein .env-Schluessel)."
            slot="${zeile%%=*}"; name="${zeile#*=}"
            [ -z "$(slotname "$slot")" ] || fail "secret-names: Slot $slot doppelt benannt."
            printf -v "SLOTNAME_$slot" '%s' "$name"
            case " $KEYS " in *" $name "*) fail "secret-names: Name $name doppelt." ;; esac
            KEYS="$KEYS $name"
          done <<< "$IN_NAMES"
          KEYS="${KEYS# }"

          # Ist jedes benannte Secret da, und ist kein Slot belegt, aber unbenannt?
          for slot in V01 V02 V03 V04 V05 V06 V07 V08 V09 V10; do
            wert="${!slot}"
            if [ -n "$(slotname "$slot")" ]; then
              [ -n "$wert" ] || fehlt="$fehlt $(slotname "$slot")"
            elif [ -n "$wert" ]; then
              fail "Slot $slot ist belegt, aber in secret-names nicht benannt (falscher Slot?)."
            fi
          done
          [ -n "$SSH_KEY" ] || fehlt="$fehlt SSH_KEY"
          if [ -n "$fehlt" ]; then
            for n in $fehlt; do echo "FEHLT $n"; done
            fail "Fehlende GitHub-Secrets:$fehlt (unter https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions anlegen)."
          fi

          # Zufallsschluessel und Klartextwerte
          RANDOM_KEYS=""
          for name in $IN_RANDOM; do
            passt "$name" "$NAME_RE" || fail "random-keys: '$name' ist kein .env-Schluessel."
            case " $KEYS $RANDOM_KEYS " in *" $name "*) fail "random-keys: $name kommt schon anderswo vor." ;; esac
            RANDOM_KEYS="$RANDOM_KEYS $name"
          done
          RANDOM_KEYS="${RANDOM_KEYS# }"

          PAYLOAD="$RUNNER_TEMP/dbs-payload"
          : > "$PAYLOAD"; chmod 600 "$PAYLOAD"
          for slot in V01 V02 V03 V04 V05 V06 V07 V08 V09 V10; do
            if [ -n "$(slotname "$slot")" ]; then setwert "$(slotname "$slot")" "${!slot}"; fi
          done
          PLAIN_KEYS=""
          while IFS= read -r zeile || [ -n "$zeile" ]; do
            zeile="${zeile%$'\r'}"
            [ -n "${zeile// }" ] || continue
            passt "$zeile" '^[A-Za-z_][A-Za-z0-9_]*=.+$' || fail "plain-values: Zeile nicht der Form NAME=wert."
            name="${zeile%%=*}"
            case " $KEYS $RANDOM_KEYS $PLAIN_KEYS " in *" $name "*) fail "plain-values: $name kommt schon anderswo vor." ;; esac
            setwert "$name" "${zeile#*=}"
            PLAIN_KEYS="$PLAIN_KEYS $name"
          done <<< "$IN_PLAIN"
          PLAIN_KEYS="${PLAIN_KEYS# }"
          ALLE_WERTE="$KEYS${KEYS:+${PLAIN_KEYS:+ }}$PLAIN_KEYS"
          [ -n "$ALLE_WERTE" ] || fail "Mindestens ein Wert noetig: secret-names und plain-values sind beide leer."

          # Formpruefung jedes Werts, ohne ihn auszugeben.
          for name in $ALLE_WERTE; do
            wert="$(wertvon "$name")"
            passt "$wert" "$WERT_RE" \
              || fail "Wert von $name enthaelt unerlaubte Zeichen (Leerzeichen, Zeilenumbruch, Anfuehrungszeichen, Backslash, \$ oder #?)."
            [ "${#wert}" -le 4096 ] || fail "Wert von $name ist laenger als 4096 Zeichen."
          done
          while IFS= read -r zeile || [ -n "$zeile" ]; do
            zeile="${zeile%$'\r'}"
            [ -n "${zeile// }" ] || continue
            name="${zeile%%=*}"; muster="${zeile#*=}"
            [ "$zeile" != "$name" ] && [ -n "$muster" ] || fail "patterns: Zeile nicht der Form NAME=ERE."
            hatwert "$name" || fail "patterns: $name ist kein uebergebener Wert."
            rc=0; printf '%s' "$(wertvon "$name")" | grep -Eq -- "$muster" || rc=$?
            [ "$rc" -ne 2 ] || fail "patterns: Muster fuer $name ist kein gueltiger Ausdruck (grep -E)."
            [ "$rc" -eq 0 ] || fail "Wert von $name hat nicht die erwartete Form (Muster aus patterns; Leerzeichen/Zeilenumbruch/Anfuehrungszeichen im Secret?)."
          done <<< "$IN_PATTERNS"

          # Nutzlast: Kopf (nicht geheim) + Werte. Nur diese Datei geht per stdin raus.
          {
            printf '#DBS1\n'
            printf '#ENV=%s\n' "$IN_ENVFILE"
            printf '#DRY=%s\n' "$([ "$IN_DRY" = true ] && echo 1 || echo 0)"
            printf '#KEYS=%s\n' "$ALLE_WERTE"
            printf '#ZUFALL=%s\n' "$RANDOM_KEYS"
            for name in $ALLE_WERTE; do
              printf '%s=%s\n' "$name" "$(wertvon "$name")"
            done
          } > "$PAYLOAD"
          echo "Alle Eingaben vorhanden und formal in Ordnung ($(echo $ALLE_WERTE | wc -w | tr -d ' ') Werte, $(echo $RANDOM_KEYS | wc -w | tr -d ' ') Zufallswerte, dry-run=$IN_DRY)."

      - name: SSH-Key und gepinnter Hostschluessel
        id: ssh
        env:
          IN_HOST: ${{ inputs.host }}
          IN_USER: ${{ inputs.user }}
          IN_PORT: ${{ inputs.port }}
          IN_HOSTKEY: ${{ inputs.host-key }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set +x
          umask 077
          D="$RUNNER_TEMP/dbs-ssh"
          mkdir -p "$D"
          printf '%s\n' "$SSH_KEY" > "$D/key"
          chmod 600 "$D/key"
          # Nur dieser eine Schluessel. Kein ssh-keyscan: der vertraut jedem, der
          # im Moment unter der Adresse antwortet. Wer die Verbindung umlenkt (DNS,
          # Route), bekaeme sonst die Werte im Klartext.
          if [ "$IN_PORT" = "22" ]; then
            printf '%s %s\n' "$IN_HOST" "$IN_HOSTKEY" > "$D/known_hosts"
          else
            printf '[%s]:%s %s\n' "$IN_HOST" "$IN_PORT" "$IN_HOSTKEY" > "$D/known_hosts"
          fi
          chmod 600 "$D/known_hosts"
          ssh-keygen -l -f "$D/known_hosts" >/dev/null 2>&1 \
            || { echo "::error::host-key ist kein lesbarer Schluessel."; exit 1; }
          echo "Gepinnter Hostschluessel: $(ssh-keygen -l -f "$D/known_hosts" | cut -d' ' -f2)"
          # GlobalKnownHostsFile /dev/null: die Systemdatei des Runners darf nie
          # als Vertrauensanker dienen. StrictHostKeyChecking yes: kein stilles
          # Nachtragen, jeder andere Schluessel bricht ab.
          cat > "$D/config" <<CONF
          Host dbs-ziel
            HostName $IN_HOST
            Port $IN_PORT
            User $IN_USER
            IdentityFile $D/key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $D/known_hosts
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            VerifyHostKeyDNS no
            CheckHostIP no
            UpdateHostKeys no
            ForwardAgent no
            PasswordAuthentication no
            ConnectTimeout 20
            RequestTTY no
          CONF
          chmod 600 "$D/config"

      - name: Eintragen (Werte nur per stdin, nie als Argument)
        id: eintragen
        run: |
          set +x
          umask 077
          # REMOTE-SKRIPT (POSIX sh; der Server nutzt dash). Es steht als ganzes hier,
          # damit der Test EXAKT diesen Text ausfuehrt. Es enthaelt KEINE Werte: die
          # kommen ueber stdin. Als base64 uebergeben, damit kein Quoting der
          # Login-Shell dazwischenfunkt; `sh -c` liest stdin weiter fuer die Werte.
          cat > "$RUNNER_TEMP/dbs-remote.sh" <<'REMOTE_SCRIPT'
          set -eu
          umask 077
          D=$(mktemp -d)
          EFILE=""
          NEU=""
          trap 'rm -rf "$D"; [ -z "$NEU" ] || rm -f "$NEU" "$NEU.a" "$NEU.b"' EXIT
          abbruch() { echo "$1 — Abbruch, Datei unberuehrt."; exit 1; }
          cat > "$D/in"

          head -n 1 "$D/in" | grep -qx '#DBS1' || abbruch "Nutzlast unbekannt"
          hdr() { sed -n "s/^#$1=//p" "$D/in" | head -n 1; }
          EFILE=$(hdr ENV); DRY=$(hdr DRY); KEYS=$(hdr KEYS); ZUFALL=$(hdr ZUFALL)
          printf '%s' "$EFILE" | grep -Eq '^/[A-Za-z0-9._/-]+$' || abbruch "Pfad der .env ungueltig"
          case "$EFILE" in *..*) abbruch "Pfad der .env ungueltig" ;; esac
          case "$DRY" in 0|1) ;; *) abbruch "DRY ungueltig" ;; esac
          for k in $KEYS $ZUFALL; do
            printf '%s' "$k" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$' || abbruch "Schluesselname ungueltig"
          done
          grep -v '^#' "$D/in" > "$D/vals" || true
          # Zweite Sicherung gegen Fehler auf dem Runner: nur Zeilen NAME=sicherer Wert.
          if grep -Evq '^[A-Za-z_][A-Za-z0-9_]*=[A-Za-z0-9_.:/+=@%,~-]+$' "$D/vals"; then
            abbruch "Nutzlast enthaelt eine unzulaessige Zeile"
          fi
          [ -n "$KEYS" ] || abbruch "Keine Schluessel in der Nutzlast"
          # Genau eine Zeile je Schluessel: ein eingeschleuster Zeilenumbruch im Wert
          # ergaebe eine Zeile zu viel und bricht hier ab.
          [ "$(grep -c '' "$D/vals")" = "$(echo $KEYS | wc -w | tr -d ' ')" ] || abbruch "Nutzlast passt nicht zur Schluesselliste"
          [ -f "$EFILE" ] && [ ! -L "$EFILE" ] || abbruch "Keine regulaere Datei $EFILE"

          wert() { grep "^$1=" "$2" | tail -n 1 | cut -d= -f2- | tr -d "\"' "; }
          zufall() {
            if command -v openssl >/dev/null 2>&1; then openssl rand -hex 32
            else head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; fi
          }
          eigner() { stat -c %u "$1" 2>/dev/null || stat -f %u "$1"; }
          modus() { stat -c '%a %U:%G' "$1" 2>/dev/null || stat -f '%Lp %Su:%Sg' "$1"; }
          [ "$(eigner "$EFILE")" = "$(id -u)" ] || abbruch "Die .env gehoert nicht dem SSH-Nutzer (der Austausch wuerde den Besitzer aendern)"

          if [ "$DRY" = 1 ]; then SETZT="wuerde gesetzt"; else SETZT="gesetzt"; fi

          # 1) Was aendert sich? Log ohne Werte.
          AENDERUNG=""
          for k in $KEYS; do
            [ "$(grep -c "^$k=" "$D/vals")" = 1 ] || { echo "FEHLT $k"; abbruch "$k nicht genau einmal in der Nutzlast"; }
            alt=$(wert "$k" "$EFILE"); neu=$(wert "$k" "$D/vals")
            if [ "$alt" = "$neu" ]; then echo "OK  $k: unveraendert"; else echo "OK  $k: $SETZT"; AENDERUNG=1; fi
          done
          ERZEUGEN=""
          for k in $ZUFALL; do
            alt=$(wert "$k" "$EFILE")
            if [ -n "$alt" ]; then echo "OK  $k: unveraendert"; else echo "OK  $k: $SETZT"; ERZEUGEN="$ERZEUGEN $k"; AENDERUNG=1; fi
          done
          # Nichts zu tun: Datei bleibt BYTEGLEICH (kein Umsortieren, keine Sicherung).
          [ -n "$AENDERUNG" ] || { echo "Nichts zu aendern — Datei nicht angefasst."; exit 0; }

          # 2) Neue Datei bauen: Zeilen aller verwalteten Schluessel raus, dann je
          #    Schluessel genau EINE Zeile: neuer Wert / erzeugter Zufallswert / die
          #    bisherige Zeile unveraendert (samt Anfuehrungszeichen).
          FILT=""; for k in $KEYS $ZUFALL; do FILT="$FILT -e ^$k="; done
          NEU="$EFILE.dbs-neu"
          {
            grep -v $FILT "$EFILE" || true
            for k in $KEYS; do
              if [ "$(wert "$k" "$EFILE")" = "$(wert "$k" "$D/vals")" ]; then grep "^$k=" "$EFILE" | tail -n 1
              else grep "^$k=" "$D/vals" | tail -n 1; fi
            done
            for k in $ZUFALL; do
              case " $ERZEUGEN " in
                *" $k "*)
                  z=$(zufall)
                  printf '%s' "$z" | grep -Eq '^[0-9a-f]{64}$' || abbruch "Zufallswert fuer $k konnte nicht erzeugt werden"
                  printf '%s=%s\n' "$k" "$z" ;;
                *) grep "^$k=" "$EFILE" | tail -n 1 ;;
              esac
            done
          } > "$NEU"
          chmod 600 "$NEU"

          # 3) VOR dem Austausch pruefen: alle uebrigen Zeilen unveraendert, jeder
          #    verwaltete Schluessel genau einmal, nicht leer, mit dem erwarteten Wert.
          grep -v $FILT "$EFILE" > "$NEU.a" || true
          grep -v $FILT "$NEU" > "$NEU.b" || true
          cmp -s "$NEU.a" "$NEU.b" || abbruch "Andere Zeilen haetten sich veraendert"
          for k in $KEYS $ZUFALL; do
            [ "$(grep -c "^$k=" "$NEU")" = 1 ] || abbruch "$k nicht genau einmal"
            [ -n "$(wert "$k" "$NEU")" ] || abbruch "$k leer"
          done
          for k in $KEYS; do
            [ "$(wert "$k" "$NEU")" = "$(wert "$k" "$D/vals")" ] || abbruch "$k hat nicht den uebergebenen Wert"
          done
          for k in $ZUFALL; do
            case " $ERZEUGEN " in *" $k "*) ;; *)
              [ "$(wert "$k" "$NEU")" = "$(wert "$k" "$EFILE")" ] || abbruch "$k haette sich veraendert" ;;
            esac
          done

          if [ "$DRY" = 1 ]; then echo "DRY-RUN: Pruefung bestanden, .env NICHT veraendert."; exit 0; fi

          # 4) Sicherung, dann atomar ersetzen (temp im selben Ordner + mv); 600 gesetzt.
          cp -p "$EFILE" "$EFILE.bak-vor-secrets"
          mv "$NEU" "$EFILE"
          echo "Datei: $(modus "$EFILE") | Zeilen vorher=$(grep -c "" "$EFILE.bak-vor-secrets") nachher=$(grep -c "" "$EFILE")"
          REMOTE_SCRIPT
          B64=$(base64 < "$RUNNER_TEMP/dbs-remote.sh" | tr -d '\n')
          ssh -F "$RUNNER_TEMP/dbs-ssh/config" dbs-ziel "sh -c \"\$(printf %s $B64 | base64 -d)\"" < "$RUNNER_TEMP/dbs-payload"

      - name: Aufraeumen (Runner)
        id: aufraeumen
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/dbs-payload" "$RUNNER_TEMP/dbs-ssh" "$RUNNER_TEMP/dbs-remote.sh"
